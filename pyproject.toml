[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-audio-fetch"
version = "0.1.0"
description = "Politely download freely-offered audio (music, audiobooks, podcasts, classics) from the open web."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["audio", "downloader", "public-domain", "creative-commons", "podcasts", "audiobooks"]
authors = [{ name = "open-audio-fetch contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio",
]
# Standard library only — no runtime dependencies, by design.
dependencies = []

[project.urls]
Homepage = "https://github.com/"
Source = "https://github.com/"

[project.scripts]
open-audio-fetch = "open_audio_fetch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/open_audio_fetch"]

[tool.hatch.build.targets.sdist]
include = ["src/open_audio_fetch", "README.md", "SITES.md", "backlog.md", "tests"]

# Tests use only the standard library's unittest, so `python -m unittest` needs
# nothing installed. pytest is optional and simply discovers the same tests.
[tool.pytest.ini_options]
testpaths = ["tests"]
